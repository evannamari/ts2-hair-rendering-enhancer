; ============================================================
; TS2HairRenderingEnhancer.ini - place next to TS2HairRenderingEnhancer.asi
; Restart the game after changing any setting.
; ============================================================
[Hair]

; 1 = mod enabled, 0 = disabled.
; Ctrl+Shift+F8 toggles the mod in game (until restart).
Enabled=1

; Threshold (0-255) that separates the dense part of the hair from its soft edges.
; Above the threshold: dense areas, which write depth.
; Below the threshold: semi-transparent edges, which do not write depth.
; A higher value makes the soft edge wider but shrinks the dense part of the hair.
; 60 is the standard value.
SolidAlphaRef=60

; Sorting of triangles by distance to the camera.
; 0 = off (recommended).
; 1 = may improve how overlapping strands blend,
;     but can punch holes into the hair and costs more CPU time.
; Ctrl+Shift+F7 toggles sorting in game (until restart).
SortTriangles=0

; 1 = write an activity log (TS2HairRenderingEnhancer.log next to the .asi), 0 = do not create a log file.
; The log is useful when you want to report a problem.
WriteLog=1

; ------------------------------------------------------------
; Advanced settings. Usually there is no need to change these.
; ------------------------------------------------------------

; How the mod recognizes the standard hair draw calls.
; Do not change unless you know why.
SignatureAlphaRef=60

; Drawing mode:
; 1 = dense part and soft edges are drawn separately.
; 0 = legacy mode: colour first, then a depth fill.
; Ctrl+Shift+F6 toggles the mode in game (until restart).
Mode=1

; Alpha threshold of the colour pass in Mode=0.
; A lower value keeps more semi-transparent pixels.
SoftAlphaRef=0

; Extra depth-fill pass in Mode=0.
; 1 = on, 0 = off.
DepthFill=1

; Alpha threshold of the depth fill in Mode=0.
; Decides which hair pixels write depth.
DepthAlphaRef=60

